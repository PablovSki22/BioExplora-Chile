<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b132b">

    <meta
        name="description"
        content="Portal de monitoreo y exploración de la biodiversidad silvestre de Chile."
    >

    <title>BioExplora Chile</title>

    ./manifest.json

    ./favicon_192.png

    ./favicon_512.png

    ./favicon_192.png

    <style>
        :root {
            color-scheme: dark;
            background-color: #0b132b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background-color: #0b132b;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #f8fafc;
        }

        main {
            width: min(100%, 460px);
            text-align: center;
        }

        .icono {
            width: 144px;
            height: 144px;
            border-radius: 28px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        p {
            margin: 14px 0 24px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .boton {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 10px;
            color: white;
            background: linear-gradient(
                135deg,
                #10b981 0%,
                #059669 100%
            );
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
        }

        .boton:hover {
            background: linear-gradient(
                135deg,
                #059669 0%,
                #047857 100%
            );
        }

        .estado {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <main>
        ./favicon_192.png

        <h1>BioExplora Chile</h1>

        <p>
            Portal de Monitoreo de Biodiversidad Silvestre.
            Abriendo la aplicación segura…
        </p>

        <a
            class="boton"
            href="https://bioexplora-chile-bvqicnxuaj6zhnxfqmdwgv.streamlit.app/"
        >
            Abrir BioExplora Chile
        </a>

        <div class="estado">
            Se requiere conexión a internet.
        </div>
    </main>

    <script>
        const URL_APP =
            "https://bioexplora-chile-bvqicnxuaj6zhnxfqmdwgv.streamlit.app/";

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(
                    (error) => {
                        console.error(
                            "No se pudo registrar el service worker:",
                            error
                        );
                    }
                );
            });
        }

        window.setTimeout(() => {
            window.location.replace(URL_APP);
        }, 1800);
    </script>
</body>
</html>
